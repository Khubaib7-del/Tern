[package]
name = "tern-platform"
description = "OS integration for Tern: keychains, app data paths, disk checks, the reduced-motion setting, the file opener, the microphone."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tern-core.workspace = true
directories.workspace = true
fs4.workspace = true
thiserror.workspace = true
url.workspace = true

# The microphone (`mic` feature, enabled by the desktop app through
# tern-agent): cpal, Apache-2.0. On Linux it needs ALSA (libasound2-dev).
cpal = { workspace = true, optional = true }

[features]
mic = ["dep:cpal"]

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
keyring-core.workspace = true
windows-native-keyring-store.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
keyring-core.workspace = true
zbus-secret-service-keyring-store.workspace = true
linux-keyutils-keyring-store.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring-core.workspace = true
apple-native-keyring-store.workspace = true
