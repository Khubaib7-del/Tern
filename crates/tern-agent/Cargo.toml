[package]
name = "tern-agent"
description = "The Tern engine: bounded turn loop, policy gate, tool registry, provider setup, diagnostics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true

# The workspace lints, except that unsafe code is denied rather than
# forbidden: `local_models::gpu` lists ggml's devices and holds the Windows
# delay-load hook, and allows it there alone.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
tern-core.workspace = true
tern-platform.workspace = true
tern-store.workspace = true
tern-providers.workspace = true
base64.workspace = true
tern-crawl.workspace = true
tern-research.workspace = true
tern-study.workspace = true
tern-decision.workspace = true
tern-eval.workspace = true
regex.workspace = true
url.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
time = { workspace = true, features = ["local-offset"] }
tokio = { workspace = true, features = ["process", "io-util", "io-std", "sync"] }
sha1_smol.workspace = true
sha2.workspace = true
zip.workspace = true
lopdf.workspace = true
oar-ocr = { workspace = true, optional = true }
image.workspace = true
whisper-rs = { workspace = true, optional = true }
# Physical cores, for whisper.cpp's thread count.
num_cpus = { version = "1", optional = true }
symphonia = { workspace = true, optional = true }
ort = { workspace = true, optional = true }
loqui-kokoro = { workspace = true, optional = true }
loqui-g2p = { workspace = true, optional = true }
# run_python (#75): Monty, a Python-subset interpreter in Rust (MIT).
monty = "1.4"
monty-types = "1.4"
# Diffs before a file write (#75). Apache-2.0; already in the tree.
similar = "2"

# Sandbox v1 (#75): process groups and rlimits.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Sandbox v1 (#75): a Job Object around each command's process tree.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[features]
# The microphone, through tern-platform (cpal). The desktop app turns it on.
mic = ["tern-platform/mic"]
# Local OCR: PaddleOCR models on ONNX Runtime (oar-ocr). The desktop app
# and the CLI turn it on.
ocr-onnx = ["dep:oar-ocr"]
# Decoding audio files (WAV, MP3, M4A/AAC, Ogg Vorbis, FLAC) to 16 kHz
# mono for the local speech models (symphonia, pure Rust).
audio = ["dep:symphonia"]
# Local transcription: Whisper models on whisper.cpp (whisper-rs, built
# statically, CPU). The desktop app and the CLI turn it on.
whisper = ["audio", "dep:whisper-rs", "dep:num_cpus"]
# Whisper on the GPU: whisper.cpp's Vulkan backend (Windows, Linux; needs
# the Vulkan SDK or headers and glslc to build) or Metal (macOS). Without
# a usable GPU at run time Whisper runs on the CPU (local_models::gpu).
whisper-vulkan = ["whisper", "whisper-rs/vulkan", "whisper-rs/raw-api"]
whisper-metal = ["whisper", "whisper-rs/metal", "whisper-rs/raw-api"]
# Local live dictation: Moonshine Streaming on ONNX Runtime (ort, the
# runtime OCR already links). The desktop app and the CLI turn it on.
asr-onnx = ["audio", "dep:ort"]
# Read aloud (#69): Kokoro-82M on ONNX Runtime (loqui-kokoro, MIT) with
# loqui-g2p's English phonemes (no espeak-ng). The desktop app and the CLI
# turn it on.
tts = ["dep:loqui-kokoro", "dep:loqui-g2p", "dep:ort"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
wiremock.workspace = true
tempfile.workspace = true
