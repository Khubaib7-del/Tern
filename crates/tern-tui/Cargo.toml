[package]
name = "tern-tui"
description = "The `tern` command: CLI commands and the ratatui TUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "tern"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
tern-core.workspace = true
tern-agent = { workspace = true, features = ["ocr-onnx", "whisper", "asr-onnx"] }
clap.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
ratatui.workspace = true
unicode-width.workspace = true
rpassword.workspace = true

# Embeds the icon and version information into the .exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]

# Whisper on the GPU (#67): Vulkan on Windows and Linux, Metal on macOS.
# With no usable GPU at run time it runs on the CPU.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tern-agent = { workspace = true, features = ["whisper-vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
tern-agent = { workspace = true, features = ["whisper-metal"] }
