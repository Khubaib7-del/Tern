[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license-file = "LICENSE"
publish = false
repository = "https://github.com/Khubaib7-del/Tern"

[workspace.dependencies]
tern-core = { path = "crates/tern-core" }
tern-platform = { path = "crates/tern-platform" }
tern-store = { path = "crates/tern-store" }
tern-agent = { path = "crates/tern-agent" }
tern-providers = { path = "crates/tern-providers" }
tern-decision = { path = "crates/tern-decision" }
tern-crawl = { path = "crates/tern-crawl" }
tern-research = { path = "crates/tern-research" }
tern-study = { path = "crates/tern-study" }
tern-eval = { path = "crates/tern-eval" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = { version = "1", features = ["serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
regex = "1"
directories = "6"
fs4 = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
keyring-core = "1"
windows-native-keyring-store = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }
linux-keyutils-keyring-store = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
toml = "1"
tempfile = "3"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
wiremock = "0.6"
rpassword = "7"
url = "2"
ratatui = "0.30"
unicode-width = "0.2"
scraper = "0.29"
ego-tree = "0.11"
pdf-extract = "0.9"
base64 = "0.22"
futures = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
# The local OCR engine (PaddleOCR on ONNX Runtime; tern-agent's `ocr-onnx`).
oar-ocr = { version = "=0.10.1", default-features = false, features = ["download-binaries"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
sha1_smol = "1"
sha2 = "0.10"
cpal = "0.18"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
