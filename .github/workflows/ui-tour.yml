name: UI tour (screen recording)

# Records the desktop app walking every screen with the hidden scripted
# tour (`TERN_TOUR=1`, crates/tern-desktop/src/view/tour.rs): demo data in
# a throwaway folder, no model calls, no keys. Uploads the video and the
# timestamped scene log, used to compare the app with the v2 concept.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Run part of the tour: `perf` runs only the frame-cost scenes (Settings › Providers vs Tools)"
        required: false
        default: ""
  push:
    branches: [feat/v2-polish]
    paths:
      - "crates/**"
      - "Cargo.lock"
      - ".github/workflows/ui-tour.yml"

permissions:
  contents: read

concurrency:
  group: ui-tour-${{ github.ref }}-${{ inputs.only }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux tour (Xvfb + lavapipe, ffmpeg x11grab)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space (unused preinstalled SDKs)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          df -h /
      - uses: actions/checkout@v7
      - name: Cached apt debs
        uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-tour-linux-${{ hashFiles('.github/workflows/ui-tour.yml', '.github/scripts/apt-install.sh') }}
          restore-keys: apt-tour-linux-
      - name: System libraries, Xvfb, lavapipe (software Vulkan), fonts, ffmpeg
        timeout-minutes: 40
        run: |
          .github/scripts/apt-install.sh ~/apt-debs \
            build-essential pkg-config libfontconfig-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libvulkan1 libssl-dev libasound2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            xvfb xauth x11-utils mesa-vulkan-drivers vulkan-tools \
            fonts-dejavu fonts-noto-core fonts-noto-color-emoji fonts-liberation \
            ffmpeg dbus-x11 xdotool
          ls /usr/share/vulkan/icd.d/
      # whisper.cpp's Vulkan backend (#67) builds against the Vulkan SDK.
      - name: Vulkan SDK (cached)
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ui-tour-vulkan
      - name: Build tern-desktop and the browser helper (release)
        run: cargo build --release --locked -p tern-desktop -p tern-browser
      - name: Record the tour
        env:
          WGPU_BACKEND: vulkan
          WGPU_POWER_PREF: low
          RUST_BACKTRACE: "1"
          TERN_TOUR: "1"
          TERN_TOUR_ONLY: ${{ inputs.only }}
          TERN_TOUR_HOME: ${{ runner.temp }}/tern-tour-home
          TERN_KEYRING: keyutils
        run: |
          set -u
          mkdir -p out
          # Lavapipe, Mesa's software Vulkan (Ubuntu 24.04 names it lvp_icd.json).
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          export VK_ICD_FILENAMES="$icd" VK_DRIVER_FILES="$icd"
          echo "Vulkan ICD: $icd"
          cat > tour.sh <<'EOS'
          set -u
          vulkaninfo --summary > out/vulkaninfo.txt 2>&1 || true
          xdpyinfo | head -40 > out/xdpyinfo.txt 2>&1 || true
          ffmpeg -y -loglevel warning -f x11grab -video_size 1600x1000 -framerate 30 -i "$DISPLAY" \
            -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p out/tern-current-tour.mp4 \
            > out/ffmpeg.log 2>&1 &
          ff=$!
          date +%s%3N > out/rec_start_unix_ms.txt
          export TERN_TOUR_LOG="$PWD/out/scene-log.txt"
          # Xvfb has no window manager, so nothing gives Tern's window the
          # keyboard focus and GPUI treats it as inactive: no caret, no
          # selection. Focus it once it is mapped.
          (for i in $(seq 1 60); do
             w=$(xdotool search --onlyvisible --class 'khubaib7_del' 2>/dev/null | head -n 1)
             [ -z "$w" ] && [ "$i" -gt 20 ] && w=$(xdotool search --onlyvisible --maxdepth 1 --name '.*' 2>/dev/null | tail -n 1)
             if [ -n "$w" ]; then xdotool windowfocus "$w" && echo "focused $w" >> out/xdotool.txt && break; fi
             sleep 1
           done) &
          timeout 900 dbus-run-session -- ./target/release/tern-desktop --tour > out/tour-stdout.txt 2> out/tour-stderr.txt
          echo $? > out/tour-exit.txt
          sleep 1
          kill -INT $ff
          wait $ff || true
          EOS
          xvfb-run -n 99 -s "-screen 0 1600x1000x24" bash tour.sh
          echo "exit $(cat out/tour-exit.txt)"
          tail -n 40 out/tour-stderr.txt || true
          cat out/scene-log.txt || true
          grep -h PERF out/tour-stdout.txt out/scene-log.txt > out/perf.txt || true
          cat out/perf.txt || true
          ls -la out
          ffprobe -v error -show_entries format=duration -of csv=p=0 out/tern-current-tour.mp4 || true
          cp "${TERN_TOUR_HOME}/data/logs/crash.log" out/ 2>/dev/null || true
          find "${TERN_TOUR_HOME}" -name '*.log' -exec cp {} out/ \; 2>/dev/null || true
      - name: Frames per scene (two stills a scene, from the scene log)
        if: always()
        run: |
          set -u
          mkdir -p out/frames
          start=$(cat out/rec_start_unix_ms.txt 2>/dev/null || echo 0)
          grep -h '^TOUR scene' out/scene-log.txt 2>/dev/null | while read -r line; do
            ms=$(echo "$line" | sed -n 's/.*unix_ms=\([0-9]*\).*/\1/p')
            id=$(echo "$line" | sed -n 's/.* id=\([^ ]*\).*/\1/p')
            [ -n "$ms" ] && [ -n "$id" ] || continue
            for d in 900 2400; do
              at=$(awk "BEGIN{printf \"%.2f\", ($ms - $start + $d)/1000}")
              ffmpeg -y -loglevel error -ss "$at" -i out/tern-current-tour.mp4 -frames:v 1 "out/frames/${id}-${d}.png" || true
            done
          done
          ls out/frames | head -100
      - name: Upload the recording and scene log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tern-ui-tour-linux
          path: out/
          retention-days: 14

  windows:
    name: Windows tour (gdigrab, best effort)
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-release-msvc-o2-vulkan
      # The SDK only, no runtime: the tour runner has no GPU and no
      # vulkan-1.dll, so speech must fall back to the CPU (#67).
      - name: Vulkan SDK (cached)
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true
          install_runtime: false
      - name: Build tern-desktop and the browser helper (release)
        run: cargo build --release --locked -p tern-desktop -p tern-browser
      - name: Record the tour
        shell: pwsh
        env:
          TERN_TOUR: "1"
          TERN_TOUR_ONLY: ${{ inputs.only }}
          TERN_TOUR_HOME: ${{ runner.temp }}\tern-tour-home
          # The runner's desktop is 1024×768; leave room for the taskbar.
          TERN_TOUR_SIZE: 1024x720
        run: |
          choco install ffmpeg -y --no-progress | Out-Null
          New-Item -ItemType Directory -Force out | Out-Null
          $env:TERN_TOUR_LOG = "$PWD\out\scene-log.txt"
          $ff = Start-Process ffmpeg -ArgumentList '-y','-loglevel','warning','-f','gdigrab','-framerate','30','-i','desktop','-c:v','libx264','-preset','veryfast','-crf','23','-pix_fmt','yuv420p','out\tern-current-tour-windows.mkv' -PassThru -WindowStyle Hidden -RedirectStandardError out\ffmpeg.log
          [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() | Out-File out\rec_start_unix_ms.txt
          $p = Start-Process .\target\release\tern-desktop.exe -ArgumentList '--tour' -PassThru -RedirectStandardOutput out\tour-stdout.txt -RedirectStandardError out\tour-stderr.txt
          if (-not $p.WaitForExit(900000)) { $p.Kill() }
          # ffmpeg is killed, which loses what its encoder still holds: keep
          # recording a while so the last scenes are written.
          Start-Sleep 12
          # A killed recording is still a readable Matroska file; remux it.
          Stop-Process -Id $ff.Id
          Start-Sleep 3
          ffmpeg -y -loglevel warning -i out\tern-current-tour-windows.mkv -c copy out\tern-current-tour-windows.mp4
          Get-ChildItem out
          Get-Content out\scene-log.txt -ErrorAction SilentlyContinue
          Select-String -Path out\tour-stdout.txt,out\scene-log.txt -Pattern 'PERF' -ErrorAction SilentlyContinue | ForEach-Object { $_.Line } | Tee-Object out\perf.txt
      - name: Upload the Windows recording
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tern-ui-tour-windows
          path: out/
          retention-days: 14
