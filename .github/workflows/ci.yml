name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  windows:
    name: Windows (fmt, clippy, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: tern doctor
        shell: pwsh
        run: |
          $env:TERN_HOME = "$env:RUNNER_TEMP\tern-home"
          cargo run --locked -p tern-tui -- doctor

  desktop:
    name: Windows desktop build (download to test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-release
      - name: Build tern-desktop and tern (release)
        run: cargo build --release --locked -p tern-desktop -p tern-tui
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: tern-windows-x64
          path: |
            target/release/tern-desktop.exe
            target/release/tern.exe
          retention-days: 14
