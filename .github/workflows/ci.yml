name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # The speech benchmark downloads the #64 build to time it against this one.
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  windows:
    name: Windows (fmt, clippy, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Explain in 3D steps on a 1 MB stack (GPUI-free simulation)
        run: cargo test --locked -p tern-desktop --bin tern-desktop -- step_changes_run_on_a_one_megabyte_stack
      - name: tern doctor
        shell: pwsh
        run: |
          $env:TERN_HOME = "$env:RUNNER_TEMP\tern-home"
          cargo run --locked -p tern-tui -- doctor
      - name: Evaluation (offline suites, 3 trials, baseline check)
        shell: pwsh
        run: |
          $env:TERN_HOME = "$env:RUNNER_TEMP\tern-eval-home"
          cargo run --locked -p tern-tui -- eval run --level synthetic --trials 3 --check-baseline
          Get-Content (Get-ChildItem "$env:TERN_HOME\evals\runs\*.md" | Select-Object -First 1).FullName | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - name: Upload the evaluation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tern-eval-report
          path: ${{ runner.temp }}/tern-eval-home/evals/runs/
          retention-days: 14

  desktop:
    name: Windows desktop build (download to test)
    runs-on: windows-latest
    # whisper.cpp is built by CMake inside whisper-rs. Left alone it
    # compiles for the CI machine's CPU (GGML_NATIVE: AVX-512 on these
    # runners), which a laptop without AVX-512 cannot run. Build for any
    # x86-64 CPU from 2013 on (AVX2, FMA, F16C) instead.
    env:
      GGML_NATIVE: "OFF"
      GGML_AVX: "ON"
      GGML_AVX2: "ON"
      GGML_FMA: "ON"
      GGML_F16C: "ON"
      GGML_BMI2: "ON"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-release
      - name: Build tern-desktop, tern and the browser helper (release)
        run: cargo build --release --locked -p tern-desktop -p tern-tui -p tern-browser
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: tern-windows-x64
          path: |
            target/release/tern-desktop.exe
            target/release/tern.exe
            target/release/tern-browser.exe
          retention-days: 14
      - name: ffmpeg for the speech benchmark
        shell: pwsh
        run: choco install ffmpeg -y --no-progress | Out-Null
      - name: Speech benchmark, this build (local Whisper and Moonshine, release tern.exe)
        shell: bash
        run: .github/scripts/speech-bench.sh "$PWD/target/release/tern.exe" "Windows, this PR"
      - name: The #64 build (what was tested on Windows), for comparison
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: tern-windows-x64
          path: pr64
          run-id: 40208545129
          github-token: ${{ github.token }}
      - name: Speech benchmark, the #64 build
        continue-on-error: true
        shell: bash
        run: .github/scripts/speech-bench.sh "$PWD/pr64/tern.exe" "Windows, #64 build"

  linux:
    name: Linux (fmt, clippy, test, eval, desktop build)
    runs-on: ubuntu-latest
    # whisper.cpp is built by CMake inside whisper-rs. Left alone it
    # compiles for the CI machine's CPU (GGML_NATIVE: AVX-512 on these
    # runners), which a laptop without AVX-512 cannot run. Build for any
    # x86-64 CPU from 2013 on (AVX2, FMA, F16C) instead.
    env:
      GGML_NATIVE: "OFF"
      GGML_AVX: "ON"
      GGML_AVX2: "ON"
      GGML_FMA: "ON"
      GGML_F16C: "ON"
      GGML_BMI2: "ON"
    steps:
      # The ubuntu runner has about 14 GB free; the debug test build plus the
      # release desktop build need more. Drop preinstalled SDKs Tern never uses.
      - name: Free disk space (unused preinstalled SDKs)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          df -h /
      - uses: actions/checkout@v7
      - name: System libraries for the desktop app (X11, Wayland, Vulkan, fonts) and the browser helper (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libfontconfig-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libssl-dev libasound2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: tern doctor (kernel keyring; the runner has no Secret Service)
        env:
          TERN_HOME: ${{ runner.temp }}/tern-home
          TERN_KEYRING: keyutils
        run: cargo run --locked -p tern-tui -- doctor
      - name: Evaluation (offline suites, 3 trials, baseline check)
        env:
          TERN_HOME: ${{ runner.temp }}/tern-eval-home
        run: |
          cargo run --locked -p tern-tui -- eval run --level synthetic --trials 3 --check-baseline
          cat "$TERN_HOME"/evals/runs/*.md >> "$GITHUB_STEP_SUMMARY"
      - name: Build tern-desktop, tern and the browser helper (release)
        run: cargo build --release --locked -p tern-desktop -p tern-tui -p tern-browser
      - name: Speech benchmark (local Whisper and Moonshine, release tern)
        run: .github/scripts/speech-bench.sh "$PWD/target/release/tern" "Linux"
      - name: Package tern-linux-x64.tar.gz
        run: |
          set -eu
          out=tern-linux-x64
          mkdir -p "$out/share/applications" "$out/share/icons/hicolor/512x512/apps"
          cp target/release/tern target/release/tern-desktop target/release/tern-browser "$out/"
          cp crates/tern-desktop/packaging/linux/io.github.khubaib7_del.Tern.desktop "$out/share/applications/"
          cp assets/brand/tern-app-icon.png "$out/share/icons/hicolor/512x512/apps/io.github.khubaib7_del.Tern.png"
          cp LICENSE "$out/"
          printf '%s\n' \
            'Tern (pre-alpha, not released). Linux x64 build from CI.' \
            'Run ./tern-desktop for the app or ./tern for the CLI.' \
            'The browser pane uses ./tern-browser (needs WebKitGTK 4.1: libwebkit2gtk-4.1-0).' \
            'To add Tern to your app menu: copy share/ into ~/.local/share/ and tern-desktop onto your PATH.' \
            'See docs/linux.md in the repository.' > "$out/README.txt"
          tar -czf tern-linux-x64.tar.gz "$out"
          tar -tzf tern-linux-x64.tar.gz
      - name: Upload the Linux build
        uses: actions/upload-artifact@v7
        with:
          name: tern-linux-x64
          path: tern-linux-x64.tar.gz
          retention-days: 14
      - name: Upload the evaluation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tern-eval-report-linux
          path: ${{ runner.temp }}/tern-eval-home/evals/runs/
          retention-days: 14

  macos:
    name: macOS arm64 (clippy, test, desktop build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        env:
          TERN_KEYCHAIN_TEST: "1"
        run: cargo test --workspace --locked
      - name: Evaluation (offline suites, 3 trials, baseline check)
        env:
          TERN_HOME: ${{ runner.temp }}/tern-eval-home
        run: cargo run --locked -p tern-tui -- eval run --level synthetic --trials 3 --check-baseline
      - name: Build tern-desktop, tern and the browser helper (release)
        run: cargo build --release --locked -p tern-desktop -p tern-tui -p tern-browser
      - name: Bundle Tern.app (unsigned) and zip
        run: |
          set -eu
          app=Tern.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/tern-desktop target/release/tern-browser "$app/Contents/MacOS/"
          cp crates/tern-desktop/packaging/macos/Info.plist "$app/Contents/"
          iconset=Tern.iconset
          mkdir -p "$iconset"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/brand/tern-app-icon.png --out "$iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d assets/brand/tern-app-icon.png --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/Tern.icns"
          plutil -lint "$app/Contents/Info.plist"
          mkdir -p tern-macos-arm64
          mv "$app" tern-macos-arm64/
          cp target/release/tern target/release/tern-browser tern-macos-arm64/
          cp LICENSE tern-macos-arm64/
          printf '%s\n' \
            'Tern (pre-alpha, not released). macOS arm64 build from CI, unsigned.' \
            'First launch: right-click Tern.app, choose Open, then Open again (Gatekeeper).' \
            'The CLI is ./tern. See docs/macos.md in the repository.' > tern-macos-arm64/README.txt
          ditto -c -k --keepParent tern-macos-arm64 tern-macos-arm64.zip
          unzip -l tern-macos-arm64.zip
      - name: Upload the macOS build
        uses: actions/upload-artifact@v7
        with:
          name: tern-macos-arm64
          path: tern-macos-arm64.zip
          retention-days: 14
